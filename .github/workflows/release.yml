name: Phase 2 — Validate & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate registry and marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin and skills
        run: bash scripts/validate.sh
      - name: Validate marketplace metadata
        run: bash scripts/validate-marketplace.sh

  build-synopsis:
    name: Build Synopsis (${{ matrix.rid }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            os: macos-14
            asset: synopsis-osx-arm64.tar.gz
            slim_asset: synopsis-osx-arm64-slim.tar.gz
          - rid: osx-x64
            os: macos-14
            asset: synopsis-osx-x64.tar.gz
            slim_asset: synopsis-osx-x64-slim.tar.gz
          - rid: win-x64
            os: windows-latest
            asset: synopsis-win-x64.zip
            slim_asset: synopsis-win-x64-slim.zip
          - rid: win-arm64
            os: windows-latest
            asset: synopsis-win-arm64.zip
            slim_asset: synopsis-win-arm64-slim.zip
          - rid: linux-x64
            os: ubuntu-latest
            asset: synopsis-linux-x64.tar.gz
            slim_asset: synopsis-linux-x64-slim.tar.gz
          - rid: linux-arm64
            os: ubuntu-latest
            asset: synopsis-linux-arm64.tar.gz
            slim_asset: synopsis-linux-arm64-slim.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Build and publish
        working-directory: src/synopsis
        run: |
          dotnet build Synopsis.sln -c Release
          dotnet test Synopsis.Tests -c Release --no-build
          dotnet publish Synopsis/Synopsis.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish/${{ matrix.rid }}
          dotnet publish Synopsis/Synopsis.csproj -c Release -r ${{ matrix.rid }} --self-contained false -p:PublishReadyToRun=false -o publish/${{ matrix.rid }}-slim

      - name: Create archives (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.asset }} -C src/synopsis/publish/${{ matrix.rid }} .
          tar -czf ${{ matrix.slim_asset }} -C src/synopsis/publish/${{ matrix.rid }}-slim .

      - name: Create archives (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path src/synopsis/publish/${{ matrix.rid }}/* -DestinationPath ${{ matrix.asset }}
          Compress-Archive -Path src/synopsis/publish/${{ matrix.rid }}-slim/* -DestinationPath ${{ matrix.slim_asset }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synopsis-${{ matrix.rid }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.slim_asset }}

  publish:
    name: Publish GitHub release
    needs: [validate, build-synopsis]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag/version alignment
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION="$(jq -r '.version' .claude-plugin/plugin.json)"
          MARKETPLACE_VERSION="$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"

          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "ERROR: tag version ($TAG_VERSION) does not match plugin version ($PLUGIN_VERSION)"
            exit 1
          fi

          if [ "$PLUGIN_VERSION" != "$MARKETPLACE_VERSION" ]; then
            echo "ERROR: plugin version ($PLUGIN_VERSION) does not match marketplace version ($MARKETPLACE_VERSION)"
            exit 1
          fi

      - name: Download Synopsis binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Build skills archive
        run: |
          VERSION="$(jq -r '.version' .claude-plugin/plugin.json)"
          SKILL_COUNT="$(jq '.skills | length' .claude-plugin/plugin.json)"
          tar -czf "dotnet-episteme-skills-${VERSION}.tar.gz" .claude-plugin .codex-plugin .mcp.json agents bin codex commands docs hooks monitors opencode package.json skills scripts workflows README.md
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SKILL_COUNT=$SKILL_COUNT" >> "$GITHUB_ENV"

          # Extract changelog section for this version (between this header and the next)
          NOTES="$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)"
          # Store as multiline env var
          {
            echo "RELEASE_NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Collect release files
        run: |
          mkdir -p release-files
          cp dotnet-episteme-skills-${VERSION}.tar.gz release-files/
          # Move Synopsis archives from per-artifact directories
          find release-assets -name "synopsis-*" -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## DotNet Episteme Skills ${{ env.VERSION }}

            **Skills included:** ${{ env.SKILL_COUNT }}

            ${{ env.RELEASE_NOTES }}

            ---

            ### Synopsis binaries (auto-downloaded on first use)
            | Platform | Self-contained | Slim (needs .NET 10 SDK) |
            |---|---|---|
            | macOS Apple Silicon | `synopsis-osx-arm64.tar.gz` | `synopsis-osx-arm64-slim.tar.gz` |
            | macOS Intel | `synopsis-osx-x64.tar.gz` | `synopsis-osx-x64-slim.tar.gz` |
            | Windows x64 | `synopsis-win-x64.zip` | `synopsis-win-x64-slim.zip` |
            | Windows arm64 | `synopsis-win-arm64.zip` | `synopsis-win-arm64-slim.zip` |
            | Linux x64 | `synopsis-linux-x64.tar.gz` | `synopsis-linux-x64-slim.tar.gz` |
            | Linux arm64 | `synopsis-linux-arm64.tar.gz` | `synopsis-linux-arm64-slim.tar.gz` |

            The detect script (`scripts/detect-tool.sh` / `.ps1`) auto-downloads the correct binary on first use: the slim framework-dependent build when a .NET 10 SDK is installed (~7x smaller), the self-contained build otherwise. No manual install needed.

            ### Skills archive
            `dotnet-episteme-skills-${{ env.VERSION }}.tar.gz` contains all skill definitions for manual installation.
          files: release-files/*

  publish-npm:
    name: Publish OpenCode plugin to npm
    needs: [validate, publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag/package version alignment
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(jq -r '.version' package.json)"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Verify the packaged plugin registers
        run: node scripts/test-opencode-plugin.mjs

      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip publish
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN secret not configured - skipping npm publish. Set it in repo settings to enable."
